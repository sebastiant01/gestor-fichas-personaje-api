name: CI Back-End - Pruebas y verificaciones

"on":
    pull_request:
        branches:
            - main

jobs:
    verificar:
        name: Verificar código formato PEP 8 y ejecutar testing
        runs-on: ubuntu-latest

        steps:
            - name: Descargar el código del repo
              uses: actions/checkout@v4

            - name: Instalar Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: pip

            - name: Instalar dependencias
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Testing con Pytest
              env:
                DATABASE_URL: "sqlite:///:memory:"
                JWT_KEY: ${{ secrets.JWT_KEY }}
                ALGORITHM: ${{ secrets.ALGORITHM }}
                ACCESS_TOKEN_EXPIRE: 20
                REFRESH_TOKEN_EXPIRE: 4
              run: |
                python -m pytest src/tests/repository-test/ -q
                python -m pytest src/tests/service-test/ -q
                python -m pytest src/tests/router-test/ -q
                
            - name: Formateo PEP 8 con Black
              env:
                DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: |
                python -m black src/ --check --quiet
                